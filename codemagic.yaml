workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic App Manager
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uptimeprizes.app
      vars:
        XCODE_WORKSPACE: "UpTimePrizes.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "UpTimePrizes"
        APP_STORE_APPLE_ID: "com.uptimeprizes.app"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set build number
        script: |
          # Use Codemagic's BUILD_NUMBER (auto-increments each build) offset by 100
          # so we stay well above any previously uploaded version
          BUILD_NUM=$((BUILD_NUMBER + 100))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          # Patch project.yml before XcodeGen runs
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml
          cat project.yml | grep CURRENT_PROJECT_VERSION
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Run unit tests
        script: |
          # A failing test stops the build here — nothing reaches TestFlight
          # without the rules passing. Picks any available iPhone simulator.
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid']); raise SystemExit
          raise SystemExit('no iPhone simulator available')
          ")
          echo "Using simulator: $DEVICE_ID"
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild test \
            -project UpTimePrizes.xcodeproj \
            -scheme UpTimePrizes \
            -destination "id=$DEVICE_ID" \
            | tee /tmp/xcodebuild_logs/tests.log
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "UpTimePrizes.xcodeproj/project.xcworkspace" \
            --scheme "UpTimePrizes"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-assign every build to the public-link external group, so no
        # build ever sits unassigned in ASC again (builds 120/123 both did).
        # External builds still pass Beta App Review — usually minutes for
        # follow-ups — so delivery is no-clicks, not instant. The founder's
        # phone is the group's single (1/1) tester seat.
        beta_groups:
          - "Public Link"
        submit_to_app_store: false

  # Builds the download packs for the paid journeys (delivery memo, 26 Sept).
  # Started by hand; never part of an app build. Reads the PRIVATE music
  # repository with a read-only deploy key held encrypted in the
  # ios_audio_repo group. Uploading the packs to Apple comes later, after
  # the account migration and the downloader extension.
  ios-asset-packs:
    name: iOS Asset Packs (paid music)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_audio_repo
      xcode: latest
    scripts:
      - name: Fetch the paid music (private repository, read-only key)
        script: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Strip Windows line endings a pasted key may carry.
          printf '%s\n' "$AUDIO_REPO_SSH_KEY" | tr -d '\r' > ~/.ssh/uptime_audio
          chmod 600 ~/.ssh/uptime_audio
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/uptime_audio -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:uptimeprizes-ai/uptime-ios-audio.git "$CM_BUILD_DIR/audio"
          echo "[PACKS] fetched $(find "$CM_BUILD_DIR/audio" -name '*.m4a' | wc -l | tr -d ' ') song files"
      - name: Verify every file against its fingerprint
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/audio"
          shasum -a 256 -c SHA256SUMS --quiet
          echo "[PACKS] all $(wc -l < SHA256SUMS | tr -d ' ') fingerprints match"
      - name: Show the packaging tool and its manifest template
        script: |
          set -euo pipefail
          xcodebuild -version
          xcrun --find ba-package
          xcrun ba-package template -o /tmp/ba_template.json
          cat /tmp/ba_template.json
      - name: Build one asset pack per journey
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/audio"
          mkdir -p "$CM_BUILD_DIR/packs"
          for j in cast-prelude warm-front daybreak-shuffle catalyst educator overture; do
            python3 "$CM_BUILD_DIR/scripts/make_pack_manifest.py" "$j" > "manifest_$j.json"
            cat "manifest_$j.json" | head -12
            xcrun ba-package "manifest_$j.json" -o "$CM_BUILD_DIR/packs/$j.aar"
            echo "[PACKS] $j: $(ls "$j"/*.m4a | wc -l | tr -d ' ') songs -> $(du -h "$CM_BUILD_DIR/packs/$j.aar" | cut -f1)"
          done
          ls -la "$CM_BUILD_DIR/packs"
    artifacts:
      - packs/*.aar
