workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic App Manager
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uptimeprizes.app
      vars:
        XCODE_WORKSPACE: "UpTimePrizes.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "UpTimePrizes"
        APP_STORE_APPLE_ID: "com.uptimeprizes.app"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set build number
        script: |
          # Use Codemagic's BUILD_NUMBER (auto-increments each build) offset by 100
          # so we stay well above any previously uploaded version
          BUILD_NUM=$((BUILD_NUMBER + 100))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          # Patch project.yml before XcodeGen runs
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml
          cat project.yml | grep CURRENT_PROJECT_VERSION
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Run unit tests
        script: |
          # A failing test stops the build here — nothing reaches TestFlight
          # without the rules passing. Picks any available iPhone simulator.
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid']); raise SystemExit
          raise SystemExit('no iPhone simulator available')
          ")
          echo "Using simulator: $DEVICE_ID"
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild test \
            -project UpTimePrizes.xcodeproj \
            -scheme UpTimePrizes \
            -destination "id=$DEVICE_ID" \
            | tee /tmp/xcodebuild_logs/tests.log
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "UpTimePrizes.xcodeproj/project.xcworkspace" \
            --scheme "UpTimePrizes"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-assign every build to the public-link external group, so no
        # build ever sits unassigned in ASC again (builds 120/123 both did).
        # External builds still pass Beta App Review — usually minutes for
        # follow-ups — so delivery is no-clicks, not instant. The founder's
        # phone is the group's single (1/1) tester seat.
        beta_groups:
          - "Public Link"
        submit_to_app_store: false
