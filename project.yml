name: UpTimePrizes


options:
  bundleIdPrefix: com.uptimeprizes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true


settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 12


targets:
  UpTimePrizes:
    type: application
    platform: iOS
    sources:
      - path: UpTimePrizes
        excludes:
          - "Resources/Audio/**"
          - "Resources/uptime_full_manifest.json"
    resources:
      - path: UpTimePrizes/Resources/Assets.xcassets
      # type: folder makes this a folder REFERENCE, copied wholesale into the
      # bundle as Audio/… — the plain group form silently dropped every audio
      # file from builds #1–20 (3 MB ipas with no songs). Lookups use
      # subdirectory "Audio/<journeyId>". Guarded by BundledAudioTests.
      - path: UpTimePrizes/Resources/Audio
        type: folder
        buildPhase: resources
      - path: UpTimePrizes/Resources/Fonts
        buildPhase: resources
      - path: UpTimePrizes/Resources/uptime_full_manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uptimeprizes.app
        INFOPLIST_KEY_CFBundleDisplayName: "UpTime Prizes"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    info:
      path: UpTimePrizes/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - fetch
        UIAppFonts:
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-SemiBold.ttf

  UpTimePrizesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UpTimePrizesTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UpTimePrizes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/UpTimePrizes"
    dependencies:
      - target: UpTimePrizes

schemes:
  UpTimePrizes:
    build:
      targets:
        UpTimePrizes: all
    test:
      targets:
        - UpTimePrizesTests
