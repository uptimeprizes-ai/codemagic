name: UpTimePrizes


options:
  bundleIdPrefix: com.uptimeprizes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true


settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 12


targets:
  UpTimePrizes:
    type: application
    platform: iOS
    # NOTE: XcodeGen targets have NO `resources:` key — a block by that name
    # is silently ignored, which is exactly how builds #1–21 shipped without
    # audio (and #20–21 without the manifest). Everything must be declared as
    # a `sources` entry; xcassets/ttf auto-assign to the resources phase, and
    # explicit entries below carry `buildPhase: resources`.
    # Guarded by BundledAudioTests and BundledManifestTests — if packaging
    # breaks again, the build fails before TestFlight.
    sources:
      - path: UpTimePrizes
        excludes:
          - "Resources/Audio/**"
          - "Resources/uptime_full_manifest.json"
          - "Resources/Sounds/**"
      - path: UpTimePrizes/Resources/uptime_full_manifest.json
        buildPhase: resources
      # The AlarmKit doorbell — at the bundle ROOT, where AlertSound.named
      # looks for it. Guarded by BundledAudioTests.
      - path: UpTimePrizes/Resources/Sounds/door_bell_006.m4a
        buildPhase: resources
      # A folder REFERENCE (type: folder), copied wholesale into the bundle
      # as Audio/… — lookups use subdirectory "Audio/<journeyId>".
      - path: UpTimePrizes/Resources/Audio
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uptimeprizes.app
        INFOPLIST_KEY_CFBundleDisplayName: "UpTime Prizes"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    info:
      path: UpTimePrizes/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        # Shown in the system's AlarmKit permission dialog. Marked placeholder
        # until the curator rules the sentence.
        NSAlarmKitUsageDescription: "[COPY PENDING] UpTime Prizes rings your morning alarm."
        UIBackgroundModes:
          - audio
          - fetch
        UIAppFonts:
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-SemiBold.ttf

  UpTimePrizesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UpTimePrizesTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UpTimePrizes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/UpTimePrizes"
    dependencies:
      - target: UpTimePrizes

schemes:
  UpTimePrizes:
    build:
      targets:
        UpTimePrizes: all
    test:
      targets:
        - UpTimePrizesTests
